services:
  - type: web
    name: abaddon-live-feed
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python live_feed_server.py
    autoDeploy: true
    envVars:
      - key: PUBLIC_FEED_RELAY_KEY
        sync: false
      - key: ABADDON_FIVEM_BRIDGE_SECRET
        sync: false
      - key: DISCORD_OAUTH_CLIENT_ID
        sync: false
      - key: DISCORD_OAUTH_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_REDIRECT_URI
        sync: false
      - key: PUBLIC_FEED_ALLOWED_ORIGIN
        sync: false
